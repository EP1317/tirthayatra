    <linearGradient id="d-brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f4dea0"/><stop offset="100%" stop-color="#a07830"/></linearGradient>
    <linearGradient id="d-flame" x1="0.5" y1="1" x2="0.5" y2="0"><stop offset="0%" stop-color="#c2341a"/><stop offset="45%" stop-color="#e09010"/><stop offset="100%" stop-color="#fff4c8"/></linearGradient>
    <radialGradient id="d-glow" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#ffd27a" stop-opacity="0.55"/><stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
